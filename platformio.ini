; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev, tests

[firmware]
build_flags = -include src/main.h

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
framework = arduino
build_unflags = -std=gnu++11
monitor_rts = 0
extra_scripts = pre:scripts/build_views.py
build_flags =
    ${firmware.build_flags}
    !python3 scripts/debug_build_flags.py
;monitor_dtr = 0
lib_deps =
    WebSockets
    ArduinoJson
    https://github.com/tanakamasayuki/EspUsbHost.git#cd0de6815d1694eaf9d59b9ca8bb80fde44261f9

[env:esp32dev-debug]
extends = env:esp32dev
build_flags =
    ${firmware.build_flags}
    -DNETWORK_DEBUG_RUNTIME_CONFIG

[env:tests]
platform = native
build_unflags = -std=gnu++11
lib_deps =
    ArduinoFake
